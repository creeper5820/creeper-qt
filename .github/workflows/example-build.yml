name: 📦 Nightly Build Example

on:
  push:
    branches: [ main ]
  schedule:
  - cron: '0 0 * * *'
  workflow_dispatch:


jobs:
  pack-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y debhelper dpkg-dev imagemagick
        sudo apt install -y qt6-base-dev libeigen3-dev
        sudo apt install -y libssl-dev libssl3
        sudo apt install -y g++-14 gcc-14 cmake ninja-build
        sudo update-alternatives --install \
          /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave \
          /usr/bin/g++ g++ /usr/bin/g++-14

    - name: Build & Pack
      run: |
        cmake -B build -DBUILD_EXAMPLE=ON
        cmake --build build -j
        chmod +x ./example/deploy-linux.sh && ./example/deploy-linux.sh

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: |
          build/widgets-linux-x86_64.AppImage
          build/widgets-linux-x86_64.tar.gz

  pack-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install MSYS2 and Qt6
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-qt6 mingw-w64-x86_64-eigen3

    - name: Configure & Build
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLE=ON
        cmake --build build -j
        chmod +x ./example/deploy-windows.sh && ./example/deploy-windows.sh

    - name: Zip AppDir
      shell: pwsh
      run: |
        Compress-Archive -Path build/AppDir/* -DestinationPath build/widgets-windows-x86_64.zip

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: build/widgets-windows-x86_64.zip

  pack-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build python3-venv

    - name: Cache Android toolchain
      uses: actions/cache@v4
      with:
        path: |
          example/android/build/android-sdk
          example/android/build/Qt
          example/android/build/aqt-env
          ~/.gradle
        key: android-toolchain-${{ hashFiles('example/android/CMakePresets.json') }}

    - name: Download SDK / NDK and Qt for Android
      working-directory: example/android
      run: |
        cmake --workflow --preset download-sdk
        cmake --workflow --preset download-dep

    - name: Configure
      working-directory: example/android
      run: |
        cmake -S . -B build/app -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/android-toolchain.cmake \
          -DFETCHCONTENT_SOURCE_DIR_CREEPER-QT=$GITHUB_WORKSPACE

    - name: Build and package APK
      working-directory: example/android
      run: |
        cmake --build build/app --target apk --parallel "$(nproc)"
        cmake --build build/tools --target package

    - name: Decode release keystore
      working-directory: example/android
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "缺少 ANDROID_KEYSTORE_BASE64，无法签名发布包" >&2
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

    - name: Sign APK
      working-directory: example/android
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        SDK=build/android-sdk
        "$SDK"/build-tools/*/apksigner sign \
          --ks "$RUNNER_TEMP/release.keystore" \
          --ks-pass env:KEYSTORE_PASSWORD \
          --ks-key-alias "$KEY_ALIAS" \
          --key-pass env:KEY_PASSWORD \
          --out build/dist/widgets-android-arm64-v8a-signed.apk \
          build/dist/widgets-android-arm64-v8a.apk

    - name: Verify APK signature
      working-directory: example/android
      run: |
        SDK=build/android-sdk
        "$SDK"/build-tools/*/apksigner verify --print-certs \
          build/dist/widgets-android-arm64-v8a-signed.apk

    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-artifacts
        path: example/android/build/dist/widgets-android-arm64-v8a-signed.apk

  publish-release:
    needs: [ pack-linux, pack-windows, pack-android ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Linux Artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-artifacts
        path: build

    - name: Download Windows Artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-artifacts
        path: build

    - name: Download Android Artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-artifacts
        path: build

    - name: Publish Nightly Build Example
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly-example
        name: "🚀 Example App — Nightly Build"
        body: |
          自动生成的 **示例程序** 完整包（Linux + Windows + Android）。
          每次推送 main 分支即更新，方便快速体验功能。

          **Linux**  
          - 可直接运行 `widgets-linux-x86_64.AppImage`
          - 或解压 `widgets-linux-x86_64.tar.gz` 后执行 `AppRun`

          **Windows**  
          - 解压 `widgets-windows-x86_64.zip` 后运行 `widgets.exe`

          **Android**  
          - 安装包 `widgets-android-arm64-v8a-signed.apk`（arm64-v8a，最低 Android 9 / API 28）
          - 安装：`adb install -r widgets-android-arm64-v8a-signed.apk`
          - 签名证书 SHA-256：`F2:6D:79:56:D6:7B:1F:1C:D3:D5:4D:0A:94:C8:0A:AC:4C:FF:4F:1E:43:87:8F:67:33:6F:ED:AF:5D:05:44:96`
        files: |
          build/widgets-linux-x86_64.AppImage
          build/widgets-linux-x86_64.tar.gz
          build/widgets-windows-x86_64.zip
          build/widgets-android-arm64-v8a-signed.apk
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
