namespace: ripple

symbols:
  - file: ripple:RippleAnimation.kt
    unit: ms
    names:
      - FadeInDuration
      - FadeOutDuration
      - RadiusDuration
  - file: tokens:MotionTokens.kt
    names:
      - EasingLegacyCubicBezier

extract:
  - name: StartRadiusFactor
    file: ripple:RippleAnimation.kt
    match: 'max\(size\.width, size\.height\) \* ([\d.]+)f'
  - name: ExtraRadius
    file: ripple:RippleAnimation.kt
    match: 'private val BoundedRippleExtraRadius\s*get\(\) = (\d+)\.dp'
